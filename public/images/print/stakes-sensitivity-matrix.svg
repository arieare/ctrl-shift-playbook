<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Project standard by stakes and sensitivity</title>
  <desc id="desc">A three by three matrix mapping low, medium, and high stakes and sensitivity to Light, Standard, Elevated, and Critical project standards.</desc>
  <rect width="1200" height="400" fill="#ffffff"/>
  <g font-family="Plus Jakarta Sans, system-ui, sans-serif">
    <g fill="#5d5790" font-size="14" font-weight="600" letter-spacing="1">
      <text x="302" y="26" text-anchor="middle">SENSITIVITY LOW</text>
      <text x="654" y="26" text-anchor="middle">SENSITIVITY MEDIUM</text>
      <text x="1006" y="26" text-anchor="middle">SENSITIVITY HIGH</text>
      <text x="118" y="83" text-anchor="end">STAKES HIGH</text>
      <text x="118" y="156" text-anchor="end">STAKES MEDIUM</text>
      <text x="118" y="229" text-anchor="end">STAKES LOW</text>
    </g>
    <g>
      <rect x="130" y="42" width="344" height="64" rx="8" fill="#dcd8ec"/>
      <rect x="482" y="42" width="344" height="64" rx="8" fill="#dcd8ec"/>
      <rect x="834" y="42" width="344" height="64" rx="8" fill="#edd9d9"/>
      <rect x="130" y="115" width="344" height="64" rx="8" fill="#e1e0f2"/>
      <rect x="482" y="115" width="344" height="64" rx="8" fill="#e1e0f2"/>
      <rect x="834" y="115" width="344" height="64" rx="8" fill="#dcd8ec"/>
      <rect x="130" y="188" width="344" height="64" rx="8" fill="#f7f7f7"/>
      <rect x="482" y="188" width="344" height="64" rx="8" fill="#e1e0f2"/>
      <rect x="834" y="188" width="344" height="64" rx="8" fill="#dcd8ec"/>
    </g>
    <g font-size="17" font-weight="750" text-anchor="middle">
      <text x="302" y="80" fill="#605695">Elevated</text>
      <text x="654" y="80" fill="#605695">Elevated</text>
      <text x="1006" y="80" fill="#917577">Critical</text>
      <text x="302" y="153" fill="#42429b">Standard</text>
      <text x="654" y="153" fill="#42429b">Standard</text>
      <text x="1006" y="153" fill="#605695">Elevated</text>
      <text x="302" y="226" fill="#343131">Light</text>
      <text x="654" y="226" fill="#42429b">Standard</text>
      <text x="1006" y="226" fill="#605695">Elevated</text>
    </g>
  </g>
</svg>
